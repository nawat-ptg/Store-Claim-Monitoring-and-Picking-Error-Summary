<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Claim Monitor</title>
<style>
  :root{color-scheme:light dark;}
  *{box-sizing:border-box}
  body{margin:0;background:#f2f2ef;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  @media (prefers-color-scheme:dark){body{background:#0a0a0a;}}
  .topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;gap:6px;padding:10px 16px;flex-wrap:wrap;}
  @media (prefers-color-scheme:dark){.topbar{background:#161615;border-bottom-color:rgba(255,255,255,.08);}}
  .brand{font-weight:700;font-size:14px;color:#0b0b0b;margin-right:10px;letter-spacing:-.01em;}
  @media (prefers-color-scheme:dark){.brand{color:#fff;}}
  .tab{border:1px solid rgba(0,0,0,.12);background:transparent;color:#52514e;border-radius:9px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;}
  .tab:hover{color:#0b0b0b;}
  .tab.active{background:#2a6fd6;color:#fff;border-color:#2a6fd6;}
  @media (prefers-color-scheme:dark){.tab{color:#c3c2b7;border-color:rgba(255,255,255,.14);}.tab:hover{color:#fff;}}
  .spacer{flex:1;}
  .tbtn{border:1px solid rgba(0,0,0,.12);background:transparent;color:#52514e;border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit;}
  @media (prefers-color-scheme:dark){.tbtn{color:#c3c2b7;border-color:rgba(255,255,255,.14);}}
  .pubbtn{background:#1a9e6f;color:#fff;border-color:#1a9e6f;font-weight:600;}
  .frame{width:100%;border:0;display:block;min-height:600px;}
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">📊 Weekly Claim Monitor</span>
    <button class="tab active" data-tab="zone">เคลมรายโซน (Claims by Zone)</button>
    <button class="tab" data-tab="pick">ข้อผิดพลาดการหยิบ (Picking Error)</button>
    <button class="tab" data-tab="trend">แนวโน้มราย Owner (Monthly Trend)</button>
    <span class="spacer"></span>
    <button class="tbtn pubbtn" id="pubBtn" onclick="publish()" title="ฝังข้อมูลที่แสดงอยู่ลงในไฟล์ เพื่ออัปขึ้นเว็บให้ทุกคนเห็น">⬇︎ ดาวน์โหลดไฟล์อัปเดต (เผยแพร่)</button>
    <button class="tbtn" id="themeBtn">🌓 สว่าง/มืด</button>
  </div>
  <iframe class="frame" id="if-zone"></iframe>
  <iframe class="frame" id="if-pick" style="display:none"></iframe>

  <script>
    function b64dec(b){const bin=atob(b);const u=Uint8Array.from(bin,function(c){return c.charCodeAt(0);});return new TextDecoder("utf-8").decode(u);}
    function b64enc(str){const bytes=new TextEncoder().encode(str);let bin="";const CH=0x8000;for(let i=0;i<bytes.length;i+=CH){bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));}return btoa(bin);}
    const frames={zone:document.getElementById("if-zone"),pick:document.getElementById("if-pick"),trend:document.getElementById("if-trend")};
    frames.zone.srcdoc=b64dec(document.getElementById("b64-zone").textContent.trim());
    frames.pick.srcdoc=b64dec(document.getElementById("b64-pick").textContent.trim());
    frames.trend.srcdoc=b64dec(document.getElementById("b64-trend").textContent.trim());
    function fit(f){try{const d=f.contentDocument;if(d&&d.documentElement){const h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0);if(h>50)f.style.height=(h+4)+"px";}}catch(e){}}
    let cur="zone";
    Object.values(frames).forEach(function(f){f.addEventListener("load",function(){fit(f);});});
    setInterval(function(){fit(frames[cur]);},700);
    document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){
      cur=t.dataset.tab;
      document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("active",x===t);});
      for(const k in frames) frames[k].style.display=(k===cur)?"block":"none";
      fit(frames[cur]);
    });});
    document.getElementById("themeBtn").addEventListener("click",function(){
      for(const k in frames){try{const r=frames[k].contentDocument.documentElement;const c=r.getAttribute("data-theme");const dk=matchMedia("(prefers-color-scheme:dark)").matches;
        r.setAttribute("data-theme",c==="dark"?"light":(c==="light"?"dark":(dk?"light":"dark")));}catch(e){}}
      setTimeout(function(){fit(frames[cur]);},80);
    });
    async function publish(){
      const btn=document.getElementById("pubBtn"); const old=btn.textContent; btn.textContent="⏳ กำลังสร้างไฟล์…"; btn.disabled=true;
      try{
        const resp=await fetch(location.href,{cache:"no-store"}); if(!resp.ok) throw new Error("fetch");
        let src=await resp.text();
        const g=function(f){try{return f.contentWindow.__getData?f.contentWindow.__getData():null;}catch(e){return null;}}; const live={zone:g(frames.zone),pick:g(frames.pick),trend:g(frames.trend)};
        const ids={zone:"b64-zone",pick:"b64-pick",trend:"b64-trend"};
        let n=0;
        for(const k in ids){
          const d=live[k]; if(!d) continue;
          const re=new RegExp("(<script type=\"text/plain\" id=\""+ids[k]+"\">)([A-Za-z0-9+/=]*)(<\\/script>)");
          const m=src.match(re); if(!m) continue;
          let html=b64dec(m[2]);
          html=html.replace(/<script>window\.PUBLISHED_DATA=[\s\S]*?<\/script>/,"");
          const pb=b64enc(JSON.stringify(d));
          const inj="<script>window.PUBLISHED_DATA=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(\""+pb+"\"),function(c){return c.charCodeAt(0);})));<"+"/script>";
          html=html.replace("</head>", inj+"</head>");
          const nb=b64enc(html);
          src=src.replace(re, function(_,a,__,c){return a+nb+c;});
          n++;
        }
        const blob=new Blob([src],{type:"text/html;charset=utf-8"});
        const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="index.html";
        document.body.appendChild(a); a.click(); a.remove();
        btn.textContent="✓ ดาวน์โหลดแล้ว ("+n+" แท็บ)"; setTimeout(function(){btn.textContent=old;btn.disabled=false;},3000);
      }catch(e){ alert("สร้างไฟล์ไม่สำเร็จ — ปุ่มนี้ใช้ได้เฉพาะเมื่อเปิดจากหน้าเว็บที่โฮสต์ (https/GitHub Pages) เท่านั้น ไม่ใช่เปิดไฟล์ในเครื่อง (file://)"); btn.textContent=old; btn.disabled=false; }
    }
  </script>
