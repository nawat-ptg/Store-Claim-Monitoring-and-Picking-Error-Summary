<style>
  :root{color-scheme:light dark;}
  *{box-sizing:border-box}

  @media (prefers-color-scheme:dark){body{background:#0a0a0a;}}
  .topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid rgba(0,0,0,.08);

  .tab.active{background:#2a6fd6;color:#fff;border-color:#2a6fd6;}
  @media (prefers-color-scheme:dark){.tab{color:#c3c2b7;border-color:rgba(255,255,255,.14);}.tab:hover{color:#fff;}}
  .spacer{flex:1;}
  .tbtn{border:1px solid rgba(0,0,0,.12);background:transparent;color:#52514e;border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit;}
  @media (prefers-color-scheme:dark){.tbtn{color:#c3c2b7;border-color:rgba(255,255,255,.14);}}
  .frame{width:100%;border:0;display:block;min-height:600px;}
</style>

  <script>
    function decodeDoc(id){ const b64=document.getElementById(id).textContent.trim();
      const bin=atob(b64); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
      return new TextDecoder('utf-8').decode(bytes); }
    const frames={zone:document.getElementById('if-zone'),pick:document.getElementById('if-pick')};
    frames.zone.srcdoc=decodeDoc('b64-zone');
    frames.pick.srcdoc=decodeDoc('b64-pick');
    function fit(f){ try{ const d=f.contentDocument; if(d&&d.documentElement){ const h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0); if(h>50) f.style.height=(h+4)+'px'; } }catch(e){} }
    let cur='zone';
    Object.values(frames).forEach(f=>{ f.addEventListener('load',()=>fit(f)); });
    setInterval(()=>fit(frames[cur]),700);
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
      cur=t.dataset.tab;
      document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
      for(const k in frames) frames[k].style.display=(k===cur)?'block':'none';
      fit(frames[cur]);
    }));
    document.getElementById('themeBtn').addEventListener('click',()=>{
      for(const k in frames){ try{ const r=frames[k].contentDocument.documentElement;
        const c=r.getAttribute('data-theme'); const dk=matchMedia('(prefers-color-scheme:dark)').matches;
        r.setAttribute('data-theme', c==='dark'?'light':(c==='light'?'dark':(dk?'light':'dark'))); }catch(e){} }
      setTimeout(()=>fit(frames[cur]),60);
    });
  </script>
